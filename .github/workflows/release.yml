name: Release WP Publisher for Obsidian

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint Companion PHP
        run: php -l wordpress-companion/wp-publisher-companion/wp-publisher-companion.php

      - name: Validate and build
        run: npm run check

      - name: Validate release metadata
        run: npm run release:check

      - name: Package release assets
        shell: bash
        run: |
          plugin_id="$(node -p "require('./manifest.json').id")"
          mkdir -p release
          zip -j "release/${plugin_id}-${GITHUB_REF_NAME}.zip" \
            main.js manifest.json styles.css
          (
            cd wordpress-companion
            zip -r "../release/wp-publisher-companion.zip" \
              wp-publisher-companion
          )
          sha256sum \
            main.js \
            manifest.json \
            styles.css \
            "release/${plugin_id}-${GITHUB_REF_NAME}.zip" \
            release/wp-publisher-companion.zip \
            > release/SHA256SUMS.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          plugin_id="$(node -p "require('./manifest.json').id")"
          gh release create "$GITHUB_REF_NAME" \
            main.js \
            manifest.json \
            styles.css \
            "release/${plugin_id}-${GITHUB_REF_NAME}.zip" \
            release/wp-publisher-companion.zip \
            release/SHA256SUMS.txt \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
